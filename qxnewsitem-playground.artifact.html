  --qx-barlist-label-weight: var(--qx-weight-regular);
  --qx-barlist-label-color:  var(--qx-text-primary);
  --qx-barlist-label-width:  96px;                        /* fixed column so bars share a left edge @kind spacing */
  --qx-barlist-value-size:   var(--qx-text-sm);              /* 12px */
  --qx-barlist-value-weight: var(--qx-weight-semibold);
  --qx-barlist-value-color:  var(--qx-text-primary);
  --qx-barlist-value-width:  56px;                        /* fixed column so bars share a right edge; sized to a formatted value, not to slack @kind spacing */

  /* zero baseline (diverging bars) + reference line */
  --qx-barlist-baseline-color: var(--qx-border-color-strong);
  --qx-barlist-baseline-width: var(--qx-border-thin);        /* 1px */
  --qx-barlist-target-color:   var(--qx-viz-reference-line); /* average / target rule — same reference slate as prev-close */

  /* ============================================================
     QMSymbolList — container, collapse, entitlement
     ============================================================ */
  /* collapse / expand reveal */
  --qx-symbollist-fade-height:   40px;                    /* bottom fade in scroll mode @kind spacing */
  --qx-symbollist-toggle-padding: var(--qx-space-sm-plus) var(--qx-space-md);
  --qx-symbollist-toggle-fg:     var(--qx-text-link);
  --qx-symbollist-toggle-size:   var(--qx-text-sm);
  --qx-symbollist-toggle-weight: var(--qx-weight-semibold);
  --qx-symbollist-toggle-divider: var(--qx-quoterow-divider-color);
  /* entitlement gate — locked rows and the upgrade panel */
  --qx-symbollist-lock-row-opacity: 0.55;                 /* @kind other */
  --qx-symbollist-lock-bar-bg:   var(--qx-surface-100);       /* placeholder where a value would be */
  --qx-symbollist-lock-panel-bg: var(--qx-surface-0);
  --qx-symbollist-lock-panel-border: var(--qx-border-color);
  --qx-symbollist-lock-panel-radius: var(--qx-radius-md);
  --qx-symbollist-lock-panel-shadow: var(--qx-shadow-sm);
  --qx-symbollist-lock-panel-padding: var(--qx-space-lg);
  --qx-symbollist-lock-tile-size: 32px;                   /* @kind spacing */
  --qx-symbollist-lock-tile-bg:  var(--qx-surface-100);
  --qx-symbollist-lock-tile-fg:  var(--qx-text-secondary);
  --qx-symbollist-lock-scrim:    color-mix(in srgb, var(--qx-surface-0) 72%, transparent);

  /* ============================================================
     WidgetHeader — dense panel header (icon tile + title + info)
     ============================================================ */
  --qx-widgetheader-padding:       var(--qx-space-sm) var(--qx-space-md);
  --qx-widgetheader-gap:           var(--qx-gap-md);
  --qx-widgetheader-bg:            var(--qx-surface-0);
  --qx-widgetheader-divider-color: var(--qx-border-color);
  --qx-widgetheader-icon-size:     24px;                  /* @kind spacing */
  --qx-widgetheader-icon-radius:   var(--qx-radius-sm);
  --qx-widgetheader-icon-bg:       var(--qx-surface-100);
  --qx-widgetheader-icon-fg:       var(--qx-text-secondary);
  --qx-widgetheader-icon-glyph:    18px;                  /* @kind spacing */
  /* Denser than --card-title (16px/500) on purpose: a widget header labels a
     panel inside a dashboard, a card title heads a standalone card. */
  --qx-widgetheader-title-size:    var(--qx-text-base);
  --qx-widgetheader-title-weight:  var(--qx-weight-bold);
  --qx-widgetheader-title-fg:      var(--qx-text-primary);
  --qx-widgetheader-info-size:     16px;                  /* @kind spacing */
  --qx-widgetheader-info-fg:       var(--qx-text-muted);
  --qx-widgetheader-info-hover-fg: var(--qx-text-secondary);
  --qx-barlist-target-width:   var(--qx-rangebar-marker-tick-width); /* 3px — same tick weight as RangeBar */

  /* ---------- QuoteRow (the individual row that makes up a symbol list) ----------
     Four slots left to right: rank → logo → identity (required) → chart → data.
     QMSymbolList repeats this row; the token set is here so a single row used
     on its own (watchlist panel, search result, position row) themes the same.
     Hover comes from --qx-state-hover-bg, skeletons from --skeleton-*, score
     bands from --score-* — only geometry and the row's own ink live here. */
  --qx-quoterow-bg:            transparent;
  --qx-quoterow-hover-bg:      var(--qx-state-hover-bg);
  --qx-quoterow-divider-color: var(--qx-border-color);
  --qx-quoterow-padding-y:         var(--qx-space-sm);       /* 8px @kind spacing */
  --qx-quoterow-padding-y-compact: var(--qx-space-xs);       /* 4px @kind spacing */
  --qx-quoterow-padding-x:         var(--qx-space-md);       /* 12px @kind spacing */

  /* rank */
  --qx-quoterow-rank-width: 20px;                         /* @kind spacing */
  --qx-quoterow-rank-size:  var(--qx-text-sm);               /* 12px */
  --qx-quoterow-rank-leading: var(--qx-leading-tight);
  --qx-quoterow-rank-color: var(--qx-text-muted);

  /* logo */
  --qx-quoterow-logo-size:         28px;                  /* @kind spacing */
  --qx-quoterow-logo-size-compact: 22px;                  /* @kind spacing */
  --qx-quoterow-logo-radius:       var(--qx-radius-full);
  --qx-quoterow-logo-border:       var(--qx-border-color);
  --qx-quoterow-logo-fallback-bg:  var(--qx-surface-100);
  --qx-quoterow-logo-fallback-fg:  var(--qx-text-secondary);

  /* identity — the only required slot */
  --qx-quoterow-symbol-size:   var(--qx-text-base);          /* 14px */
  --qx-quoterow-symbol-weight: var(--qx-weight-bold);
  --qx-quoterow-symbol-color:  var(--qx-text-primary);
  --qx-quoterow-symbol-leading: var(--qx-leading-tight);     /* single line — rhythm comes from --qx-quoterow-stack-gap */
  --qx-quoterow-name-size:     var(--qx-text-sm);            /* 12px */
  --qx-quoterow-name-color:    var(--qx-text-secondary);
  --qx-quoterow-name-leading:  var(--qx-leading-sm);         /* 16px fixed — the second line's box, shared with the data slot's so both stacks align */
  --qx-quoterow-stack-gap:     var(--qx-space-xxs);          /* 2px — the vertical gap in BOTH stacked slots: symbol↔name and price↔change @kind spacing */
  --qx-quoterow-identity-width: 168px;                    /* fixed when a chart is present, so charts align @kind spacing */
  --qx-quoterow-chart-gap:      var(--qx-space-md);          /* 12px — breathing room between the chart and the data slot @kind spacing */

  /* data slot */
  --qx-quoterow-data-min-width: 72px;                     /* keeps trailing values on one right edge @kind spacing */
  --qx-quoterow-value-size:     var(--qx-text-base);         /* 14px */
  --qx-quoterow-value-weight:   var(--qx-weight-semibold);
  --qx-quoterow-value-color:    var(--qx-text-primary);
  --qx-quoterow-value-leading:  var(--qx-leading-tight);
  --qx-quoterow-meta-size:      var(--qx-text-xs);           /* 11px — the VOL / /100 suffix */
  --qx-quoterow-meta-color:     var(--qx-text-muted);
  --qx-quoterow-meta-leading:   var(--qx-quoterow-name-leading);  /* 11px VOL sits in the same 16px box as the 12px name */

  /* score bar variant */
  --qx-quoterow-scorebar-width:  64px;                    /* @kind spacing */
  --qx-quoterow-scorebar-height: var(--qx-space-xxs-plus);   /* 6px */
  --qx-quoterow-scorebar-track:  var(--qx-score-track-bg);
  --qx-quoterow-scorebar-radius: var(--qx-radius-full);
  /* filling H-bar (chart slot) — taller than the inline bar because it carries
     the score on its own, with a bordered track and a same-hue fill edge */
  --qx-quoterow-scorebar-hbar-height: 11px;               /* @kind spacing */
  --qx-quoterow-scorebar-track-border: var(--qx-score-track-border);
  --qx-quoterow-scorebar-fill-border-width: var(--qx-border-thin);
  /* dot variant — number in primary ink, band carried by a dot instead of a bar */
  --qx-quoterow-scoredot-size: var(--qx-space-sm);           /* 8px */
  --qx-quoterow-scoredot-gap:  var(--qx-gap-sm);
  /* peer comparison — industry average and signed diff */
  --qx-quoterow-peer-avg-color: var(--qx-text-muted);
  --qx-quoterow-peer-par-color: var(--qx-score-par-fg);

  /* rank-badge variant */
  --qx-quoterow-badge-width:  44px;                       /* @kind spacing */
  --qx-quoterow-badge-height: 20px;                       /* @kind spacing */
  --qx-quoterow-medal-gold-bg:       color-mix(in srgb, var(--qx-market-hold) 35%, transparent);
  --qx-quoterow-medal-gold-border:   var(--qx-market-hold-border);
  --qx-quoterow-medal-silver-bg:     var(--qx-surface-100);
  --qx-quoterow-medal-silver-border: var(--qx-surface-300);
  /* Bronze has no ramp of its own — it is a medal tint, not a system colour. */
  --qx-quoterow-medal-bronze-bg:     color-mix(in srgb, #C98A3E 26%, transparent);
  --qx-quoterow-medal-bronze-border: #C98A3E;

  /* ---------- SecurityMark (the identity tile in a row's logo slot) ----------
     A company has a logo; a barrel of crude, a 10-year note and the VIX do not.
     One tinted tile per GROUP — not per contract — so a mixed list is scannable
     without forty near-identical drawings. Tints are low-chroma on purpose: the
     mark identifies a category, it never competes with a price or a delta.
     Sizes track QuoteRow's logo slot so the two stay interchangeable. */
  --qx-securitymark-size:          var(--qx-quoterow-logo-size);
  --qx-securitymark-radius:        var(--qx-radius-sm);      /* only for shape="rounded" */
  --qx-securitymark-border:        var(--qx-border-color);
  --qx-securitymark-glyph-size:    68%;                   /* of the tile @kind other */
  --qx-securitymark-glyph-stroke:  1.6;                   /* @kind other */
  --qx-securitymark-monogram-bg:   var(--qx-surface-100);
  --qx-securitymark-monogram-fg:   var(--qx-text-secondary);
  --qx-securitymark-monogram-size: 0.4;                   /* ratio of the tile, not a length @kind other */
  --qx-securitymark-brand-bg:      var(--qx-surface-0);      /* behind a coin brand mark */
  --qx-securitymark-brand-border:  var(--qx-border-color);
  --qx-securitymark-brand-inset:   0;                     /* one inset for EVERY image mark @kind other */

  /* group tints — bg / fg / border per category */
  --qx-securitymark-energy-bg:      #EFEDF6;
  --qx-securitymark-energy-fg:      #4B4477;
  --qx-securitymark-energy-border:  #DDD9EC;
  --qx-securitymark-precious-bg:     #FAF2DE;
  --qx-securitymark-precious-fg:     #8A6A16;
  --qx-securitymark-precious-border: #F0E3C4;
  /* per-metal tints — the metal itself is the identity, so gold, silver and
     bronze keep their own colour rather than sharing one grey ingot */
  --qx-securitymark-gold-bg:       #FAF2DE;
  --qx-securitymark-gold-fg:       #8A6A16;
  --qx-securitymark-gold-border:   #EFDFB4;
  --qx-securitymark-silver-bg:     #F1F2F4;
  --qx-securitymark-silver-fg:     #5C636E;
  --qx-securitymark-silver-border: #DFE2E6;
  --qx-securitymark-bronze-bg:     #F6EBE1;
  --qx-securitymark-bronze-fg:     #8A5626;
  --qx-securitymark-bronze-border: #EBD8C6;
  --qx-securitymark-base-bg:        #F3EEEA;
  --qx-securitymark-base-fg:        #7A5A45;
  --qx-securitymark-base-border:    #E7DDD5;
  --qx-securitymark-grains-bg:      #F6F1DF;
  --qx-securitymark-grains-fg:      #79661D;
  --qx-securitymark-grains-border:  #EBE3C8;
  --qx-securitymark-softs-bg:       #EDF3EA;
  --qx-securitymark-softs-fg:       #4A6B3E;
  --qx-securitymark-softs-border:   #DCE8D6;
  --qx-securitymark-livestock-bg:     #F7EEEC;
  --qx-securitymark-livestock-fg:     #85504A;
  --qx-securitymark-livestock-border: #EEDEDA;
  --qx-securitymark-rates-bg:       var(--qx-primary-subtle);
  --qx-securitymark-rates-fg:       var(--qx-blue-900);
  --qx-securitymark-rates-border:   var(--qx-blue-200);
  --qx-securitymark-volatility-bg:     #F7ECEC;
  --qx-securitymark-volatility-fg:     var(--qx-sell);
  --qx-securitymark-volatility-border: #EFD9D9;
  --qx-securitymark-index-bg:       var(--qx-surface-100);
  --qx-securitymark-index-fg:       var(--qx-text-primary);
  --qx-securitymark-index-border:   var(--qx-surface-200);
  --qx-securitymark-fx-bg:          #EAF1F5;
  --qx-securitymark-fx-fg:          #38596B;
  --qx-securitymark-fx-border:      #D8E5EC;
  /* currency pair — two overlapping flag discs, base in front of quote */
  --qx-securitymark-pair-disc:       72%;                 /* each disc, as a share of the tile @kind other */
  --qx-securitymark-pair-ring:       var(--qx-surface-0);    /* separates the two discs */
  --qx-securitymark-pair-ring-width: var(--qx-border-medium);/* 2px */
  --qx-securitymark-pair-label-size: 0.26;                /* ratio of the tile, not a length @kind other */
  --qx-securitymark-crypto-bg:      #FAF0E4;
  --qx-securitymark-crypto-fg:      #8A5A17;
  --qx-securitymark-crypto-border:  #F0E0C9;
  --qx-securitymark-other-bg:       var(--qx-surface-100);
  --qx-securitymark-other-fg:       var(--qx-text-secondary);
  --qx-securitymark-other-border:   var(--qx-surface-200);

  /* ---------- AxisPill (last-value chip — load-bearing on independently-scaled charts) ---------- */
  --qx-axispill-padding-y:    1px;                          /* @kind spacing */
  --qx-axispill-padding-x:    var(--qx-space-xs);              /* 4px @kind spacing */
  --qx-axispill-radius:       var(--qx-radius-xs);             /* 2px */
  --qx-axispill-font-size:    var(--qx-text-xs);               /* 11px */
  --qx-axispill-fg:           var(--qx-surface-0);             /* pill ink on series-coloured fill */
  --qx-axispill-min-gap:      var(--qx-space-lg);              /* 16px — de-collision spacing */
}

/* ============================================================
   Qmodii — COMPONENT ROOT RESET
   Rule 4 of the QX scoping rules: inheritable properties flow in from the
   host page whether we want them or not. Declare them explicitly on the
   component root so a QX subtree renders identically inside any client site.

   `.qx-root` is also where every token is defined (see tokens/*.css), so the
   class is doing two jobs: it is the token scope AND the inheritance barrier.
   Anything rendering QX components must carry it.
   ============================================================ */

.qx-root {
  /* Inherited typography + colour. Every one of these is a property a host
     page's `body {}` or `*{}` rule would otherwise dictate. */
  font-family: var(--qx-font-sans, 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif);
  font-size: var(--qx-text-base, 14px);
  /* Unitless on purpose. --qx-leading-normal is 20px, correct for 14px body but
     wrong as an INHERITED default: a fixed length would hand 20px leading to
     every nested size, cramping anything larger. 1.4 is the same rhythm at base
     size (14 → 19.6px) and scales with whatever a child sets. */
  line-height: var(--qx-leading-relaxed, 1.4);
  font-weight: var(--qx-weight-regular, 400);
  letter-spacing: normal;
  color: var(--qx-text-primary, #222222);
  text-align: left;
  font-style: normal;
  text-transform: none;
  text-decoration: none;
  font-variant-ligatures: normal;
  /* Host resets frequently set these on a wrapper and we inherit the damage. */
  word-spacing: normal;
  white-space: normal;
  direction: ltr;
  /* Rendering hints. Cheap, inherited, and a host page setting the opposite on
     body would otherwise change how our type renders. */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.qx-root *,
.qx-root *::before,
.qx-root *::after { box-sizing: border-box; }

/* Interactive + tabular elements our components render. A host page's global
   reset (`button { all: unset }`, `table { border-collapse: separate }`, a
   normalize.css, a Tailwind preflight) lands on these before our own rules do,
   so each one is neutralised here rather than defended per component.

   Every element selector below sits inside `:where()`, which contributes ZERO
   specificity — so each rule weighs exactly (0,1,0), the `.qx-root` class alone.
   That still beats a host's bare `button {}` (0,0,1), but it loses to any
   single-class component rule like `.qx-btn`. Without `:where()` these would be
   (0,1,1) and would strip the padding and background off every class-styled
   component we ship. */
.qx-root :where(button, input, select, textarea) {
  font: inherit; color: inherit; letter-spacing: inherit;
  margin: 0; padding: 0; border: 0; background: none;
  border-radius: 0; text-align: inherit; text-transform: none;
  appearance: none; -webkit-appearance: none;
}
.qx-root :where(button) { cursor: pointer; }
.qx-root :where(button:disabled) { cursor: default; }
.qx-root :where(a) { color: var(--qx-text-link, #002C5A); text-decoration: none; }
.qx-root :where(a:hover) { color: var(--qx-text-link-hover, #0477D1); text-decoration: underline; }
/* Tables. Scoped to a QX table so a host page's own tables are untouched. */
.qx-root :where(table) { border-collapse: collapse; border-spacing: 0; width: auto; }
.qx-root :where(table th, table td) { vertical-align: middle; }
/* Lists inside QX components are never bulleted; scoped to our own subtree so
   a host page's prose lists on the same page are not stripped. */
.qx-root :where(ul, ol) { margin: 0; padding: 0; }
/* Margins only. Deliberately NOT font-size / font-weight: our components set
   their type inline, so flattening headings buys nothing and destroys the
   hierarchy on any QX-owned page that uses real heading elements. */
.qx-root :where(p, h1, h2, h3, h4, h5, h6, figure, blockquote) { margin: 0; }
.qx-root :where(img, svg) { max-width: none; }
.qx-root :where(fieldset) { margin: 0; padding: 0; border: 0; }
.qx-root :where(legend) { padding: 0; }
.qx-root :where(hr) { border: 0; margin: 0; }

/* Overlays portal to document.body, outside any .qx-root subtree, so they
   carry the class themselves and re-establish the same scope. */
.qx-portal { display: contents; }

/* ===== QX-NewsItem component ===== */
/* ============================================================
   QX-NewsItem — component styles
   Namespaced under .qx-newsitem. Every var() carries a resolved
   fallback so a missing token degrades to the right value.
   Depends on QX tokens (tokens/semantic.css et al).
   ============================================================ */

/* Screen-reader-only helper (locked-state description text). */
.qx-newsitem .qx-sr-only,
.qx-sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---- Row ------------------------------------------------------------- */
.qx-newsitem {
  display: block;
  position: relative;
  box-sizing: border-box;
  text-decoration: none;
  color: var(--qx-text-primary, #222222);
  background: var(--qx-surface-0, #FFFFFF);
  font-family: var(--qx-font-sans, 'Roboto', system-ui, sans-serif);
  padding: var(--qx-space-md, 12px);
  cursor: pointer;
  outline: none;
  transition: background var(--qx-duration-fast, 120ms) var(--qx-ease, cubic-bezier(0.4,0,0.2,1));
}
.qx-newsitem[data-density='compact'] { padding: var(--qx-space-sm, 8px) var(--qx-space-sm-plus, 10px); }

/* Whole row is the hover / active target, not just the headline. */
.qx-newsitem:hover,
.qx-newsitem[data-state='hover'] { background: var(--qx-state-hover-bg, #F6F6F6); }
.qx-newsitem:active,
.qx-newsitem[data-state='active'] { background: var(--qx-surface-100, #EDEDED); }
.qx-newsitem:hover .qx-ni-title,
.qx-newsitem[data-state='hover'] .qx-ni-title { color: var(--qx-text-link-hover, #0477D1); }

/* Focus: visible 2px ring on the row bounds, 2px offset, primary token.
   Colour change alone is never sufficient (WCAG 2.4.7). */
.qx-newsitem:focus-visible,
.qx-newsitem[data-state='focus'] {
  outline: 2px solid var(--qx-primary, #0477D1);
  outline-offset: 2px;
  background: var(--qx-state-hover-bg, #F6F6F6);
  z-index: 1;
}

/* ---- Signal spine — 3px left border by importance rank --------------- */
.qx-newsitem[data-signal] { padding-left: calc(var(--qx-space-md, 12px) + 3px); }
.qx-newsitem[data-density='compact'][data-signal] { padding-left: calc(var(--qx-space-sm-plus, 10px) + 3px); }
.qx-newsitem[data-signal]::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--qx-surface-300, #C7C7C7);
}
.qx-newsitem[data-signal='high']::before   { background: var(--qx-amber-500, #F59E0B); }
.qx-newsitem[data-signal='medium']::before { background: var(--qx-primary, #0477D1); }
.qx-newsitem[data-signal='low']::before    { background: var(--qx-surface-300, #C7C7C7); }

/* ---- Inner layout: media + body ------------------------------------- */
.qx-ni-inner { display: flex; gap: var(--qx-space-md, 12px); align-items: flex-start; }
.qx-newsitem[data-density='compact'] .qx-ni-inner { gap: var(--qx-space-sm, 8px); }
.qx-newsitem[data-image-pos='above'] .qx-ni-inner { flex-direction: column; }
/* Body splits into a main text column and an optional right-hand aside that
   holds the sentiment chip, AI icon, and (optionally) the meta row. */
.qx-ni-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: row; gap: var(--qx-space-md, 12px); align-items: stretch; }
.qx-ni-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--qx-space-xs, 4px); }
.qx-ni-aside { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: var(--qx-space-sm, 8px); }
.qx-ni-signal-cluster { display: flex; align-items: center; gap: var(--qx-gap-md, 8px); }
/* Meta parked in the aside is right-aligned and drops the main-column ordering. */
.qx-ni-aside .qx-ni-meta { order: 0; margin: 0; text-align: right; justify-content: flex-end; }

/* ---- Topic kicker (topicPosition='top') — own row above the headline ---- */
.qx-ni-kicker { order: 0; display: flex; margin-bottom: var(--qx-space-xxs, 2px); }

/* ---- Media ----------------------------------------------------------- */
.qx-ni-media-wrap { position: relative; flex: 0 0 auto; }
.qx-ni-media {
  width: 116px; aspect-ratio: 16 / 9; border-radius: var(--qx-radius-sm, 4px);
  overflow: hidden; background: var(--qx-surface-100, #EDEDED);
  border: 1px solid var(--qx-surface-200, #E3E3E3);
}
.qx-newsitem[data-density='compact'] .qx-ni-media { width: 96px; }
.qx-newsitem[data-image-pos='above'] .qx-ni-media-wrap { width: 100%; }
.qx-newsitem[data-image-pos='above'] .qx-ni-media { width: 100%; aspect-ratio: 16 / 9; }
.qx-ni-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Branded fallback tile — never letterbox. */
.qx-ni-media-fallback { display: flex; align-items: center; justify-content: center; background: var(--qx-primary-subtle, #F2F8FE); }
.qx-ni-fallback-mark {
  font-size: var(--qx-text-sm, 12px); font-weight: 700; letter-spacing: .04em;
  color: var(--qx-primary, #0477D1); text-transform: uppercase;
}

/* ---- Title ----------------------------------------------------------- */
.qx-ni-title {
  margin: 0; order: 2;
  font-size: var(--qx-text-base, 14px); font-weight: 600; line-height: 1.34;
  color: var(--qx-text-primary, #222222);
  display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  -webkit-line-clamp: 2;
}
.qx-newsitem[data-title-lines='1'] .qx-ni-title { -webkit-line-clamp: 1; }
.qx-newsitem[data-title-lines='2'] .qx-ni-title { -webkit-line-clamp: 2; }
.qx-newsitem[data-title-lines='3'] .qx-ni-title { -webkit-line-clamp: 3; }
.qx-newsitem[data-title-lines='full'] .qx-ni-title { -webkit-line-clamp: unset; display: block; }

    const line = (w) => el('span', { class: 'qx-ni-sk-line', style: 'width:' + (w || '100%') });
    const titleN = r.titleLines === 'full' ? 2 : r.titleLines;
    const titleW = ['92%', '68%'];
    const descW = ['100%', '96%', '54%'];
    const bodyKids = [];
    if (r.metaPosition === 'top') bodyKids.push(el('span', { class: 'qx-ni-sk-meta' }));
    bodyKids.push(el('div', { class: 'qx-ni-sk-title' }, Array.from({ length: titleN }, (_, i) => line(titleW[i]))));
    if (r.showDescription) bodyKids.push(el('div', { class: 'qx-ni-sk-desc' }, Array.from({ length: Math.min(r.descriptionLines, 3) }, (_, i) => line(descW[i]))));
    if (r.showBadgeRow) bodyKids.push(el('div', { class: 'qx-ni-sk-badges' }, [el('span'), el('span')]));
    if (r.metaPosition === 'bottom') bodyKids.push(el('span', { class: 'qx-ni-sk-meta' }));
    const body = el('div', { class: 'qx-ni-sk-body' }, bodyKids);
    const mediaEl = r.showImage ? el('div', { class: 'qx-ni-sk-media' }) : null;
    const order = r.imagePosition === 'trailing' ? [body, mediaEl] : [mediaEl, body];
    return el('div', { class: 'qx-ni-inner' }, order.filter(Boolean));
  }

  function render(props) {
    props = props || {};
    const preset = props.preset || 'feed';
    const density = props.density || 'comfortable';
    const state = props.state || 'default';
    const p = PRESETS[preset] || PRESETS.feed;

    const r = {
      metaPosition:     pick(props.metaPosition,     p.metaPosition,     'top'),
      titleLines:       pick(props.titleLines,       p.titleLines,       2),
      showDescription:  pick(props.showDescription,  p.showDescription,  true),
      descriptionLines: pick(props.descriptionLines, p.descriptionLines, 2),
      showImage:        pick(props.showImage,        p.showImage,        true),
      imagePosition:    pick(props.imagePosition,    p.imagePosition,    'leading'),
      showBadgeRow:     pick(props.showBadgeRow,     p.showBadgeRow,     true),
      showSymbol:       pick(props.showSymbol,       undefined,          !!props.symbol),
      showSentiment:    pick(props.showSentiment,    undefined,          false),
      showAI:           pick(props.showAI,           undefined,          false),
      showTopic:        pick(props.showTopic,        undefined,          !!props.topic),
      showSignalSpine:  pick(props.showSignalSpine,  undefined,          false),
      topicPosition:    pick(props.topicPosition,    undefined,          'badge'),   // 'badge' | 'top'
      sentimentPosition: pick(props.sentimentPosition, undefined,        'right'),   // 'right' | 'badge'
      aiPosition:       pick(props.aiPosition,       undefined,          'right'),   // 'right' | 'badge'
      minimalMeta:      p.minimalMeta || false,
    };

    const title = props.title || 'Headline goes here';
    const signalLevel = props.signalLevel || 'high';

    const dataAttrs = {
      class: 'qx-newsitem',
      'data-preset': preset,
      'data-density': density,
      'data-state': state,
      'data-image-pos': r.showImage ? r.imagePosition : 'none',
      'data-meta-pos': r.metaPosition,
      'data-signal': r.showSignalSpine ? signalLevel : undefined,
      'data-title-lines': r.titleLines,
      'data-desc-lines': r.descriptionLines,
    };

    if (state === 'loading') {
      return el('div', Object.assign({}, dataAttrs, { 'aria-hidden': 'true', role: 'presentation' }), [skeleton(r)]);
    }

    const isLocked = state === 'locked';

    // Reusable badge/marks
    const topicChip = (r.showTopic && props.topic) ? () => el('span', { class: 'qx-ni-topic', text: props.topic }) : null;
    let symbolChip = null;
    if (r.showSymbol && props.symbol) {
      const chg = props.symbolChange;
      const cls = 'qx-ni-symbol' + (chg != null ? (chg >= 0 ? ' qx-ni-up' : ' qx-ni-down') : '');
      const kids = [document.createTextNode(props.symbol)];
      if (chg != null) kids.push(el('span', { class: 'qx-ni-symbol-chg', text: (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%' }));
      symbolChip = el('span', { class: cls }, kids);
    }
    const sentimentChip = r.showSentiment ? sentimentIcon(props.sentiment || 'neutral') : null;
    const aiBtn = r.showAI ? aiIcon(props.aiLabel) : null;

    // Left badge row — symbol + (topic/sentiment/ai only when placed 'badge').
    let badgeRow = null;
    if (r.showBadgeRow) {
      const badges = [];
      if (symbolChip) badges.push(symbolChip);
      if (topicChip && r.topicPosition === 'badge') badges.push(topicChip());
      if (sentimentChip && r.sentimentPosition === 'badge') badges.push(sentimentChip);
      if (aiBtn && r.aiPosition === 'badge') badges.push(aiBtn);
      if (badges.length) badgeRow = el('div', { class: 'qx-ni-badges' }, badges);
    }

    // Topic kicker — own row above the headline (topicPosition='top').
    const kicker = (topicChip && r.topicPosition === 'top')
      ? el('div', { class: 'qx-ni-kicker' }, [topicChip()])
      : null;

    // Meta row
    const timeAttrs = { class: 'qx-ni-time', text: props.timestamp || '2h ago' };
    if (props.datetime) timeAttrs.datetime = props.datetime;
    const metaRow = el('div', { class: 'qx-ni-meta' }, [
      el('span', { class: 'qx-ni-source', text: props.source || 'Source name' }),
      el('span', { class: 'qx-ni-sep', 'aria-hidden': 'true', text: '·' }),
      el('time', timeAttrs),
    ]);
    const metaInMain = r.metaPosition !== 'right';

    const titleEl = el('h3', { class: 'qx-ni-title', text: title });
    const descEl = (r.showDescription && !r.minimalMeta)
      ? el('p', { class: 'qx-ni-desc', text: props.description || 'Story snippet goes here' })
      : null;

    // Main column DOM order: title → description → badges → meta → kicker
    // (headline first = the a11y name; CSS `order` sets the visual placement).
    const mainKids = [titleEl, descEl, badgeRow, metaInMain ? metaRow : null, kicker];
    if (isLocked) mainKids.push(el('span', { id: 'qx-ni-lock-desc', class: 'qx-sr-only', text: 'This story requires an upgrade to read.' }));
    const main = el('div', { class: 'qx-ni-main' }, mainKids.filter(Boolean));

    // Right aside — sentiment + AI (their default home) and optional meta.
    const cluster = [];
    if (sentimentChip && r.sentimentPosition === 'right') cluster.push(sentimentChip);
    if (aiBtn && r.aiPosition === 'right') cluster.push(aiBtn);
    const asideKids = [];
    if (cluster.length) asideKids.push(el('div', { class: 'qx-ni-signal-cluster' }, cluster));
    if (!metaInMain) asideKids.push(metaRow);
    const aside = asideKids.length ? el('div', { class: 'qx-ni-aside' }, asideKids) : null;

    const body = el('div', { class: 'qx-ni-body' }, [main, aside].filter(Boolean));

    let mediaWrap = null;
    if (r.showImage) {
      const kids = [media(props.image, props.sourceInitials, props.imageAlt)];
      if (isLocked) kids.push(el('span', { class: 'qx-ni-media-lock', 'aria-hidden': 'true' }, [lockIcon()]));
      mediaWrap = el('div', { class: 'qx-ni-media-wrap' }, kids);
    }

    const order = r.imagePosition === 'trailing' ? [body, mediaWrap] : [mediaWrap, body];
    const inner = el('div', { class: 'qx-ni-inner' }, order.filter(Boolean));

    const anchorAttrs = Object.assign({
      href: props.href || '#',
      'aria-label': title,
      'aria-describedby': isLocked ? 'qx-ni-lock-desc' : undefined,
    }, dataAttrs);

    const rowKids = [];
    if (isLocked) rowKids.push(el('span', { class: 'qx-ni-lock-badge' }, [lockIcon(), document.createTextNode('Upgrade to read')]));
    rowKids.push(inner);

    const a = el('a', anchorAttrs, rowKids);
    if (props.onActivate) a.addEventListener('click', (e) => { e.preventDefault(); props.onActivate(props); });
    return a;
  }

  root.QXNewsItem = { render, PRESETS };
})(typeof window !== 'undefined' ? window : this);

<script>

/* ============================================================

(function () {
  'use strict';

  /* ---- tiny DOM helper ---- */
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];

      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'onclick') n.addEventListener('click', v);
      else if (k === 'onchange') n.addEventListener('change', v);
      else n.setAttribute(k, v === true ? '' : v);

    return n;
  }
  const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };

  /* ---- deterministic placeholder thumbnails ---- */

      "<rect width='320' height='180' fill='" + c2 + "'/>" +
      "<circle cx='" + (40 + r(3) * 240) + "' cy='" + (30 + r(7) * 90) + "' r='" + (40 + r(5) * 50) + "' fill='" + c1 + "' opacity='0.9'/>" +
      "<rect x='" + (r(11) * 200) + "' y='" + (90 + r(9) * 60) + "' width='" + (80 + r(13) * 160) + "' height='70' fill='" + c1 + "' opacity='0.35'/>" +
      "<path d='M0 " + (120 + r(2) * 30) + " Q 80 " + (60 + r(4) * 40) + ", 160 110 T 320 90' stroke='" + c1 + "' stroke-width='4' fill='none' opacity='0.7'/>" +

  /* ---- sample feed ---- */
  const STORIES = [

    { title: 'Fed minutes signal a divided committee heading into September', description: 'Several members favored holding rates steady while a vocal minority pushed for a cut, citing softening in the labor market. Futures now price a coin-flip.', source: 'Reuters', initials: 'RE', timestamp: '1h ago', datetime: '2026-08-14T12:55:00Z', symbol: 'SPY', symbolChange: -0.42, sentiment: 'neutral', topic: 'Macro' },
    { title: 'Apple’s services segment tops estimates as hardware cycle cools', description: 'Recurring revenue crossed a new high even as iPhone units slipped, underscoring the pivot analysts have watched for three years.', source: 'CNBC', initials: 'CN', timestamp: '2h ago', datetime: '2026-08-14T11:40:00Z', symbol: 'AAPL', symbolChange: 1.24, sentiment: 'positive', topic: 'Earnings' },
    { title: 'Tesla recalls 62,000 vehicles over software fault in driver-assist stack', description: 'The over-the-air fix ships this week; regulators opened a preliminary review of the underlying subsystem.', source: 'WSJ', initials: 'WS', timestamp: '3h ago', datetime: '2026-08-14T10:30:00Z', symbol: 'TSLA', symbolChange: -2.67, sentiment: 'negative', topic: 'Autos' },
    { title: 'Oil steadies near $71 as OPEC+ holds output through the quarter', description: 'Traders shrugged off inventory builds; the cartel reaffirmed its production ceiling in a brief statement.', source: 'MarketWatch', initials: 'MW', timestamp: '4h ago', datetime: '2026-08-14T09:15:00Z', symbol: 'USO', symbolChange: 0.18, sentiment: 'neutral', topic: 'Commodities' },
    { title: 'Microsoft folds new agent tooling into Copilot for enterprise tier', description: 'The update targets regulated industries with audit trails and per-seat governance controls.', source: 'The Verge', initials: 'TV', timestamp: '5h ago', datetime: '2026-08-14T08:05:00Z', symbol: 'MSFT', symbolChange: 0.94, sentiment: 'positive', topic: 'AI' },
  ];
  const storyProps = (s, seed) => ({ title: s.title, description: s.description, source: s.source, sourceInitials: s.initials, timestamp: s.timestamp, datetime: s.datetime, image: thumb((seed || '') + s.title), symbol: s.symbol, symbolChange: s.symbolChange, sentiment: s.sentiment, topic: s.topic, imageAlt: '' });

  /* ---- control widgets ---- */

      el('span', { class: 'pg-switch' }, [input, el('span', { class: 'track' }), el('span', { class: 'thumb' })]),

  /* ---- generated code snippet ---- */
  function codeSnippet(cfg) {
    const DEF = { density: 'comfortable', state: 'default', signalLevel: 'high' };
    const rows = [];
    const add = (name, val, isStr) => {
      if (typeof val === 'boolean') { if (val) rows.push([name, null]); return; }
      if (val == null) return;
      rows.push([name, isStr ? '"' + val + '"' : '{' + JSON.stringify(val) + '}']);
    };
    add('preset', cfg.preset, true);
    if (cfg.density !== DEF.density) add('density', cfg.density, true);
    if (cfg.state !== DEF.state) add('state', cfg.state, true);
    add('titleLines', cfg.titleLines, typeof cfg.titleLines !== 'number');
    add('showDescription', cfg.showDescription);
    if (cfg.showDescription) add('descriptionLines', cfg.descriptionLines, false);
    add('showImage', cfg.showImage);
    if (cfg.showImage) add('imagePosition', cfg.imagePosition, true);
    add('metaPosition', cfg.metaPosition, true);
    add('showSymbol', cfg.showSymbol);
    add('showTopic', cfg.showTopic);
    if (cfg.showTopic && cfg.topicPosition !== 'badge') add('topicPosition', cfg.topicPosition, true);
    add('showSentiment', cfg.showSentiment);
    if (cfg.showSentiment && cfg.sentimentPosition !== 'right') add('sentimentPosition', cfg.sentimentPosition, true);
    add('showAI', cfg.showAI);
    if (cfg.showAI && cfg.aiPosition !== 'right') add('aiPosition', cfg.aiPosition, true);
    add('showSignalSpine', cfg.showSignalSpine);
    if (cfg.showSignalSpine && cfg.signalLevel !== DEF.signalLevel) add('signalLevel', cfg.signalLevel, true);

    pre.appendChild(el('span', { class: 'k', text: '<QXNewsItem' }));
    pre.appendChild(document.createTextNode('\n'));

      pre.appendChild(document.createTextNode('  '));
      pre.appendChild(el('span', { class: 'a', text: n }));
      if (v !== null) { pre.appendChild(el('span', { class: 'p', text: '=' })); pre.appendChild(el('span', { class: 'v', text: v })); }
      pre.appendChild(document.createTextNode('\n'));

    pre.appendChild(document.createTextNode('  '));
    pre.appendChild(el('span', { class: 'a', text: 'title' }));
    pre.appendChild(el('span', { class: 'p', text: '=' }));
    pre.appendChild(el('span', { class: 'v', text: '"…"' }));

  /* ---- playground ---- */
  function playground() {
    let cfg = { preset: 'feed', density: 'comfortable', state: 'default', titleLines: 2, showDescription: true, descriptionLines: 2, showImage: true, imagePosition: 'leading', metaPosition: 'top', showSymbol: true, showSentiment: true, showAI: true, showTopic: true, topicPosition: 'badge', sentimentPosition: 'right', aiPosition: 'right', showSignalSpine: false, signalLevel: 'high' };

    const controlsEl = el('div', { class: 'pg-card pg-controls' });

      el('div', { class: 'pg-stage-inner' }, [previewEl]),

    }

    function renderPreview() {
      clear(previewEl);
      const b = effBadges();
      const base = { preset: cfg.preset, density: cfg.density, titleLines: cfg.titleLines, showDescription: cfg.showDescription, descriptionLines: cfg.descriptionLines, showImage: cfg.showImage, imagePosition: cfg.imagePosition, metaPosition: cfg.metaPosition, showSignalSpine: cfg.showSignalSpine, signalLevel: cfg.signalLevel, showSymbol: b.showSymbol, showSentiment: b.showSentiment, showAI: b.showAI, showTopic: b.showTopic, topicPosition: cfg.topicPosition, sentimentPosition: cfg.sentimentPosition, aiPosition: cfg.aiPosition };

      const setPreset = (preset) => { const p = PRESETS[preset]; set({ preset, titleLines: p.titleLines, showDescription: p.showDescription, descriptionLines: p.descriptionLines, showImage: p.showImage, imagePosition: p.imagePosition, metaPosition: p.metaPosition }); };

      controlsEl.appendChild(ctrlGroup('Preset', segmented(cfg.preset, [['feed','Feed'],['editorial','Editorial'],['compact','Compact'],['lead','Lead'],['embed','Embed']], setPreset)));

      controlsEl.appendChild(ctrlGroup('State', segmented(cfg.state, [['default','Default'],['hover','Hover'],['focus','Focus'],['read','Read'],['loading','Loading'],['locked','Locked']], v => set({ state: v }))));
      controlsEl.appendChild(ctrlGroup('Title lines', segmented(cfg.titleLines, [[1,'1'],[2,'2'],[3,'3'],['full','Full']], v => set({ titleLines: v }))));
      controlsEl.appendChild(ctrlGroup('Description', [
        toggleRow('Show description', cfg.showDescription, v => set({ showDescription: v })),
        el('div', { class: 'pg-subctrl' + (cfg.showDescription ? '' : ' off') }, [segmented(cfg.descriptionLines, [[1,'1 line'],[2,'2 lines'],[3,'3 lines']], v => set({ descriptionLines: v }), !cfg.showDescription)]),
      ]));
      controlsEl.appendChild(ctrlGroup('Media', [
        toggleRow('Show image', cfg.showImage, v => set({ showImage: v })),
        el('div', { class: 'pg-subctrl' + (cfg.showImage ? '' : ' off') }, [segmented(cfg.imagePosition, [['leading','Leading'],['trailing','Trailing'],['above','Above']], v => set({ imagePosition: v }), !cfg.showImage)]),
      ]));

      const placement = (on, value, opts, key) => el('div', { class: 'pg-subctrl pg-place' + (on ? '' : ' off') }, [segmented(value, opts, v => set({ [key]: v }), !on)]);
      const badgeKids = [
        toggleRow('Symbol chip', cfg.showSymbol && !off, v => set({ showSymbol: v }), off),
        toggleRow('Topic chip', cfg.showTopic && !off, v => set({ showTopic: v }), off),
        placement(cfg.showTopic && !off, cfg.topicPosition, [['badge','In badge row'],['top','Own row on top']], 'topicPosition'),
        toggleRow('Sentiment chip', cfg.showSentiment && !off, v => set({ showSentiment: v }), off),
        placement(cfg.showSentiment && !off, cfg.sentimentPosition, [['right','Right'],['badge','Badge row']], 'sentimentPosition'),
        toggleRow('AI icon', cfg.showAI && !off, v => set({ showAI: v }), off),
        placement(cfg.showAI && !off, cfg.aiPosition, [['right','Right'],['badge','Badge row']], 'aiPosition'),
      ];
      if (off) badgeKids.push(el('p', { style: 'font-size:11px;color:var(--qx-text-muted);margin:6px 0 0', text: 'Embed preset hides the badge row.' }));

      controlsEl.appendChild(ctrlGroup('Signal spine', [
        toggleRow('Show signal spine', cfg.showSignalSpine, v => set({ showSignalSpine: v })),
        el('div', { class: 'pg-subctrl' + (cfg.showSignalSpine ? '' : ' off') }, [segmented(cfg.signalLevel, [['high','High'],['medium','Medium'],['low','Low']], v => set({ signalLevel: v }), !cfg.showSignalSpine)]),

  }

  /* ---- galleries ---- */
  function galleryCard(name, presetName, desc, listNode) {
    return el('div', { class: 'pg-card' }, [
      el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: name }), el('span', { class: 's', text: 'preset="' + presetName + '"' })]),
      el('div', { class: 'pg-card-pad' }, [el('p', { class: 'pg-gal-note', text: desc }), listNode]),

  }
  function presetList(preset, count, seed) {
    const list = el('div', { class: 'qx-news-list pg-inner-list' });
    STORIES.slice(0, count).forEach((s, i) => list.appendChild(NI.render(Object.assign({ preset, showSymbol: true, showTopic: true, showSentiment: true, showAI: true }, storyProps(s, (seed || '') + i)))));

  }
  function presetGallery() {
    return el('div', { class: 'pg-grid-2' }, [
      galleryCard('Feed', 'feed', 'Default. Meta on top, 2-line title + description, leading image, full badge row.', presetList('feed', 2, 'f')),
      galleryCard('Editorial', 'editorial', 'Meta at the bottom, 3-line description, trailing image. Reads as a curated story.', presetList('editorial', 2, 'e')),
      galleryCard('Compact', 'compact', '1-line title, no description, no image. Dense side rails and Most Read.', presetList('compact', 4, 'c')),
      galleryCard('Embed', 'embed', '1-line title, source + time only, no badge row. WMID widget contexts.', presetList('embed', 4, 'm')),
    ]);
  }
  function leadGallery() {
    const list = el('div', { class: 'qx-news-list pg-inner-list' });
    list.appendChild(NI.render(Object.assign({ preset: 'lead', showSymbol: true, showTopic: true, showSentiment: true, showSignalSpine: true, signalLevel: 'high' }, storyProps(STORIES[0], 'lead'))));
    STORIES.slice(1, 4).forEach((s, i) => list.appendChild(NI.render(Object.assign({ preset: 'feed', showSymbol: true, showTopic: true }, storyProps(s, 'lf' + i)))));
    return el('div', { class: 'pg-card' }, [
      el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: 'Lead' }), el('span', { class: 's', text: 'preset="lead" — image above, full row width. One per module, always first.' })]),
      el('div', { class: 'pg-card-pad' }, [list]),
    ]);
  }
  function statesGallery() {
    const states = [
      ['default', 'Default', 'Row at container background, divider only.'],
      ['hover', 'Hover', 'Row background shifts; headline takes link-hover colour.'],
      ['focus', 'Focus', '2px ring on the row bounds, 2px offset (WCAG 2.4.7).'],
      ['read', 'Read / visited', 'Headline drops to secondary; image at 70% opacity.'],
      ['locked', 'Locked', 'Headline legible; description + image frosted with a lock affordance.'],
      ['loading', 'Loading', 'Skeleton mirrors the configured anatomy — no layout shift.'],
    ];
    const s = STORIES[2];
    return el('div', { class: 'pg-grid-3' }, states.map(([state, name, desc]) =>
      el('div', { class: 'pg-card' }, [
        el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: name }), el('span', { class: 's', text: state })]),
        el('div', { class: 'pg-card-pad' }, [
          el('p', { class: 'pg-gal-note', style: 'min-height:34px', text: desc }),
          el('div', { class: 'pg-inner-list' }, [NI.render(Object.assign({ preset: 'feed', state, showSymbol: true, showTopic: true, showSentiment: true }, storyProps(s, 'st')))]),
        ]),
      ])
    ));
  }
  function moduleCard(icon, title, more, rows) {
    const head = el('div', { class: 'pg-module-head' }, [el('span', { class: 'icon', 'aria-hidden': 'true', text: icon }), el('span', { class: 't', text: title })]);
    if (more) head.appendChild(el('a', { class: 'more', href: '#', text: more }));
    return el('div', { class: 'pg-card' }, [head, el('div', { class: 'qx-news-list' }, rows)]);
  }
  function usageInContext() {
    const feed = moduleCard('▤', 'Market news', 'See all', STORIES.map((s, i) =>
      NI.render(Object.assign({ preset: 'feed', showSymbol: true, showTopic: true, showSentiment: true, showAI: true, showSignalSpine: i === 0, signalLevel: 'high' }, storyProps(s, 'ctx' + i)))));

    // Top Stories shows the topic as a kicker on its own row and meta on the right.
    const top = moduleCard('★', 'Top stories', null, STORIES.slice(0, 3).map((s, i) =>
      NI.render(Object.assign({ preset: 'editorial', showSymbol: true, showTopic: true, topicPosition: 'top', showSentiment: true, metaPosition: 'right' }, storyProps(s, 'top' + i)))));

    const most = moduleCard('≡', 'Most read', null, STORIES.slice(1, 6).map((s) =>
      NI.render({ preset: 'compact', title: s.title, source: s.source, sourceInitials: s.initials, timestamp: s.timestamp, datetime: s.datetime, symbol: s.symbol, symbolChange: s.symbolChange, showSymbol: true, showTopic: false })));

    const embedInner = el('div', { class: 'qx-news-list' }, STORIES.slice(2, 6).map((s) =>
      NI.render({ preset: 'embed', density: 'compact', title: s.title, source: s.source, sourceInitials: s.initials, timestamp: s.timestamp, datetime: s.datetime })));
    const embed = el('div', { class: 'pg-embed-frame' }, [
      el('p', { class: 'pg-embed-note', text: 'Third-party page · QX widget (Embed)' }),
      el('div', { class: 'pg-card', style: 'border-radius:6px' }, [
        el('div', { class: 'pg-module-head', style: 'padding:8px 12px' }, [el('span', { class: 't', style: 'font-size:13px', text: 'AAPL · News' })]),
        embedInner,
      ]),
    ]);

    return el('div', { class: 'pg-usage' }, [feed, el('div', { class: 'pg-rail' }, [top, most, embed])]);
  }

  function anatomy() {
    const rows = [
      ['Row', 'Required', 'Outer container and the single interactive target / tab stop (native <a>).'],
      ['Signal spine', 'Optional', '3px left border coloured by importance rank. Off by default.'],
      ['Media', 'Optional', 'Thumbnail or branded fallback tile, 16:9 crop-to-fill. Position: leading / trailing / above.'],
      ['Topic kicker', 'Optional', 'Topic chip on its own row above the headline (topicPosition="top").'],
      ['Meta row', 'Optional pos.', 'Source · relative timestamp. Renders top, bottom, or in the right aside — only one at a time.'],
      ['Title', 'Required', 'Headline. Line-clamped per titleLines. The accessible name.'],
      ['Description', 'Optional', 'Story snippet. Line-clamped per descriptionLines.'],
      ['Badge row', 'Optional', 'Symbol chip · topic (unless on top). Collapses with no reserved space.'],
      ['Right aside', 'Optional', 'Sentiment chip + AI icon (their default home) and, optionally, the meta row.'],
      ['Divider', 'Optional', '0.5px rule between rows — owned by the list container, not the row.'],
    ];
    const tbody = el('tbody', {}, rows.map(([n, req, note]) =>
      el('tr', {}, [el('td', { class: 'n', text: n }), el('td', { class: 'req' + (req === 'Required' ? ' yes' : ''), text: req }), el('td', { text: note })])));
    const table = el('table', { class: 'pg-anat' }, [
      el('thead', {}, [el('tr', {}, [el('th', { text: 'Part' }), el('th', { text: 'Required' }), el('th', { text: 'Notes' })])]),
      tbody,
    ]);
    const a11y = el('ul', { class: 'pg-a11y' });
    [
      'Row is a native <code>&lt;a&gt;</code> — one tab stop; <code>Enter</code> opens the story (or the upgrade modal when locked).',
      'Accessible name is the headline alone; source, time, symbol, topic and sentiment stay in DOM order after the title even when <code>metaPosition="top"</code> reorders them visually.',
      'Focus is a visible 2px ring at 2px offset — colour change is never the only signal (WCAG 2.4.7).',
      'Sentiment pairs a shape with the tone token and carries an <code>aria-label</code> ("Positive sentiment"), not colour alone (WCAG 1.4.1).',
      'The AI icon is labelled "Summary generated by AI"; the timestamp is wrapped in <code>&lt;time datetime&gt;</code>.',
      'Locked rows keep the headline legible and add <code>aria-describedby</code> explaining the upgrade — the headline is never blurred.',
    ].forEach(html => a11y.appendChild(el('li', { html })));
    return el('div', { class: 'pg-grid-2' }, [
      el('div', { class: 'pg-card' }, [el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: 'Anatomy' }), el('span', { class: 's', text: 'Feed configuration, top to bottom' })]), el('div', { class: 'pg-card-pad' }, [table])]),
      el('div', { class: 'pg-card' }, [el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: 'Accessibility' }), el('span', { class: 's', text: 'Built into the component' })]), el('div', { class: 'pg-card-pad' }, [a11y])]),
    ]);
  }

  function section(eyebrow, title, lede, body) {
    const kids = [el('p', { class: 'pg-eyebrow', text: eyebrow }), el('h2', { class: 'pg-h2', text: title })];
    if (lede) kids.push(el('p', { class: 'pg-lede', text: lede }));
    kids.push(body);
    return el('section', { class: 'pg-section' }, kids);
  }

  /* ---- mount ---- */
  const app = document.getElementById('app');
  app.appendChild(el('header', { class: 'pg-appbar' }, [
    el('span', { class: 'pg-wordmark', html: 'Qmodii<span class="dot">.</span>' }),
    el('span', { class: 'pg-title', text: 'QX-NewsItem' }),
    el('span', { class: 'pg-sub', text: 'News article row · prototype playground' }),
    el('span', { class: 'pg-spacer' }),
    el('span', { class: 'pg-tag', text: 'Draft' }),
  ]));
  const wrap = el('div', { class: 'pg-wrap' });
  wrap.appendChild(section('Playground', 'Configure the row', 'One row component for every news story across QSweb, Quotestream Mobile, Research Hub and QX/QMOD widgets. Presets are named prop bundles — pick one, then override any individual prop. Everything below is the live Qmodii component driven by design tokens.', playground()));
  const presets = el('div', {}, [presetGallery(), el('div', { style: 'height:20px' }), leadGallery()]);
  wrap.appendChild(section('Variants', 'Presets', 'Choosing a preset sets defaults; individual props stay overridable. One preset per list — a Lead row is the only permitted exception.', presets));
  wrap.appendChild(section('States', 'Interactive & render states', 'Hover, focus, read, locked and loading. The skeleton mirrors the configured anatomy exactly so nothing shifts when data lands.', statesGallery()));
  wrap.appendChild(section('In context', 'Real feed modules', 'The same component across a primary market-news feed (Feed + one Lead), a curated Top Stories rail (Editorial), a dense Most Read list (Compact), and a space-constrained third-party widget (Embed).', usageInContext()));
  wrap.appendChild(section('Reference', 'Anatomy & accessibility', null, anatomy()));
  app.appendChild(wrap);
})();

</script>
