<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QX-NewsItem — Playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230477D1'/%3E%3Crect x='7' y='9' width='11' height='8' rx='1' fill='white'/%3E%3Crect x='7' y='20' width='18' height='2' fill='white'/%3E%3Crect x='7' y='24' width='14' height='2' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="design-system/styles.css" />
<link rel="stylesheet" href="components/data/qxnewsitem.css" />
<style>
  :root { color-scheme: light; }
  body.qx-root {
    margin: 0;
    background: var(--qx-surface-ground, #F6F6F6);
    color: var(--qx-text-primary, #222);
    font-family: var(--qx-font-sans, system-ui, sans-serif);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- App chrome ---- */
  .pg-appbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--qx-surface-0, #fff);
    border-bottom: 1px solid var(--qx-surface-200, #E3E3E3);
    padding: 14px 24px; display: flex; align-items: center; gap: 16px;
  }
  .pg-wordmark { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .pg-wordmark .dot { color: var(--qx-primary, #0477D1); }
  .pg-appbar .pg-title { font-size: 14px; font-weight: 600; }
  .pg-appbar .pg-sub { font-size: 12px; color: var(--qx-text-muted, #707070); }
  .pg-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--qx-primary, #0477D1); background: var(--qx-primary-subtle, #F2F8FE);
    border: 1px solid var(--qx-blue-200, #C0DEF7); border-radius: 2px; padding: 2px 6px; }
  .pg-spacer { flex: 1 1 auto; }

  .pg-wrap { max-width: 1220px; margin: 0 auto; padding: 24px; }

  /* ---- Section scaffolding ---- */
  .pg-section { margin-bottom: 40px; }
  .pg-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--qx-text-muted, #707070); margin: 0 0 6px; }
  .pg-h2 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .pg-lede { font-size: 13px; color: var(--qx-text-secondary, #575757); margin: 0 0 18px; max-width: 72ch; line-height: 1.5; }

  .pg-card { background: var(--qx-surface-0, #fff); border: 1px solid var(--qx-surface-200, #E3E3E3); border-radius: 8px; }
  .pg-card-pad { padding: 16px; }
  .pg-card-head { padding: 12px 16px; border-bottom: 1px solid var(--qx-surface-200, #E3E3E3); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pg-card-head .t { font-size: 14px; font-weight: 700; }
  .pg-card-head .s { font-size: 12px; color: var(--qx-text-muted, #707070); }

  /* ---- Playground grid ---- */
  .pg-play { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .pg-play { grid-template-columns: 1fr; } }
  .pg-controls { position: sticky; top: 74px; }
  .pg-ctrl-group { padding: 14px 16px; border-bottom: 1px solid var(--qx-surface-100, #EDEDED); }
  .pg-ctrl-group:last-child { border-bottom: 0; }
  .pg-ctrl-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--qx-text-muted, #707070); margin: 0 0 8px; }
  .pg-subctrl { margin-top: 8px; transition: opacity 120ms; }
  .pg-subctrl.off { opacity: .4; pointer-events: none; }
  .pg-place { margin: 6px 0 10px 12px; padding-left: 10px; border-left: 2px solid var(--qx-surface-200, #E3E3E3); }
  .pg-place .pg-seg button { font-size: 11px; padding: 4px 7px; }

  /* segmented */
  .pg-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .pg-seg button {
    font-family: inherit; font-size: 12px; font-weight: 500; padding: 5px 9px;
    border-radius: var(--qx-radius-sm, 4px); cursor: pointer;
    background: var(--qx-surface-0, #fff); color: var(--qx-text-secondary, #575757);
    border: 1px solid var(--qx-surface-200, #E3E3E3); transition: all 120ms var(--qx-ease, ease);
  }
  .pg-seg button:hover { background: var(--qx-surface-50, #F6F6F6); border-color: var(--qx-surface-300, #C7C7C7); }
  .pg-seg button[aria-pressed='true'] { background: var(--qx-primary-subtle, #F2F8FE); color: var(--qx-blue-900, #002C5A); border-color: var(--qx-blue-200, #C0DEF7); font-weight: 600; }
  .pg-seg button:disabled { opacity: .5; cursor: not-allowed; }

  /* toggle row */
  .pg-toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .pg-toggle:not(:last-child) { border-bottom: 1px dashed var(--qx-surface-100, #EDEDED); }
  .pg-toggle.dim { opacity: .45; }
  .pg-switch { position: relative; width: 34px; height: 20px; flex: 0 0 auto; }
  .pg-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .pg-switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--qx-surface-300, #C7C7C7); transition: background 140ms var(--qx-ease, ease); }
  .pg-switch .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 140ms var(--qx-ease, ease); box-shadow: var(--qx-shadow-xs, 0 1px 2px rgba(0,0,0,.06)); }
  .pg-switch input:checked + .track { background: var(--qx-primary, #0477D1); }
  .pg-switch input:checked + .track + .thumb { transform: translateX(14px); }

  /* ---- Preview stage ---- */
  .pg-stage { background: var(--qx-surface-ground, #F6F6F6); border: 1px solid var(--qx-surface-200, #E3E3E3); border-radius: 8px; padding: 28px; }
  .pg-stage-inner { max-width: 560px; margin: 0 auto; }
  .pg-list-frame { border: 1px solid var(--qx-surface-200, #E3E3E3); border-radius: 8px; overflow: hidden; }
  .pg-hint { font-size: 12px; color: var(--qx-text-muted, #707070); text-align: center; margin: 14px 0 0; }

  /* generated code */
  .pg-code { margin-top: 20px; background: var(--qx-surface-900, #1a1a1a); color: #e8e8e8; border-radius: 8px; padding: 16px 18px; overflow-x: auto;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.7; white-space: pre; }
  .pg-code .k { color: #6cb6ff; } .pg-code .a { color: #f5c63f; } .pg-code .v { color: #7ee787; } .pg-code .p { color: #b0b0b0; }

  /* ---- Galleries ---- */
  .pg-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pg-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 900px) { .pg-grid-2, .pg-grid-3 { grid-template-columns: 1fr; } }
  .pg-gal-note { margin: 0 0 12px; font-size: 12px; color: var(--qx-text-secondary, #575757); line-height: 1.5; }
  .pg-inner-list { border: 1px solid var(--qx-surface-200, #E3E3E3); border-radius: 6px; overflow: hidden; }

  .pg-usage { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .pg-usage { grid-template-columns: 1fr; } }
  .pg-rail { display: flex; flex-direction: column; gap: 20px; }
  .pg-module-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--qx-surface-200, #E3E3E3); }
  .pg-module-head .icon { width: 22px; height: 22px; border-radius: 4px; background: var(--qx-primary-subtle, #F2F8FE); color: var(--qx-primary, #0477D1); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .pg-module-head .t { font-size: 14px; font-weight: 700; }
  .pg-module-head .more { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--qx-primary, #0477D1); text-decoration: none; }
  .pg-embed-frame { border: 1px dashed var(--qx-surface-300, #C7C7C7); border-radius: 8px; padding: 12px; background: repeating-linear-gradient(45deg, var(--qx-surface-50, #F6F6F6) 0 10px, var(--qx-surface-0, #fff) 10px 20px); }
  .pg-embed-note { font-size: 11px; color: var(--qx-text-muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

  table.pg-anat { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.pg-anat th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--qx-text-muted); padding: 0 12px 10px 0; border-bottom: 1px solid var(--qx-surface-200, #E3E3E3); }
  table.pg-anat td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--qx-surface-100, #EDEDED); color: var(--qx-text-secondary); vertical-align: top; line-height: 1.5; }
  table.pg-anat td.n { font-weight: 700; color: var(--qx-text-primary); white-space: nowrap; }
  table.pg-anat td.req.yes { color: var(--qx-text-positive, #2B7F45); font-weight: 600; white-space: nowrap; }
  table.pg-anat td.req { color: var(--qx-text-muted); white-space: nowrap; }
  .pg-a11y { margin: 0; padding-left: 18px; }
  .pg-a11y li { font-size: 13px; color: var(--qx-text-secondary); line-height: 1.55; margin-bottom: 8px; }
  .pg-a11y code { background: var(--qx-surface-100, #EDEDED); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body class="qx-root">
<div id="app"></div>

<script src="components/data/qxnewsitem.vanilla.js"></script>
<script>
/* ============================================================
   Playground — dependency-free. Renders the QX-NewsItem component
   (window.QXNewsItem) across a live configurator, preset & state
   galleries, and real feed modules.
   ============================================================ */
(function () {
  'use strict';
  const NI = window.QXNewsItem;
  const PRESETS = NI.PRESETS;

  /* ---- tiny DOM helper ---- */
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'onclick') n.addEventListener('click', v);
      else if (k === 'onchange') n.addEventListener('change', v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    if (children != null) [].concat(children).forEach(c => { if (c != null && c !== false) n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); });
    return n;
  }
  const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };

  /* ---- deterministic placeholder thumbnails ---- */
  const TINTS = [['#0477D1','#C0DEF7'],['#2B7F45','#CFE9D6'],['#575757','#E3E3E3'],['#D02A48','#F6D6DD'],['#F59E0B','#FBE6C2'],['#334155','#CBD5E1']];
  function thumb(seed) {
    let hs = 0; for (let i = 0; i < seed.length; i++) hs = (hs * 31 + seed.charCodeAt(i)) & 0xffffff;
    const t = TINTS[hs % TINTS.length], c1 = t[0], c2 = t[1];
    const r = (n) => ((hs >> n) & 0xff) / 255;
    const s =
      "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='180' viewBox='0 0 320 180'>" +
      "<rect width='320' height='180' fill='" + c2 + "'/>" +
      "<circle cx='" + (40 + r(3) * 240) + "' cy='" + (30 + r(7) * 90) + "' r='" + (40 + r(5) * 50) + "' fill='" + c1 + "' opacity='0.9'/>" +
      "<rect x='" + (r(11) * 200) + "' y='" + (90 + r(9) * 60) + "' width='" + (80 + r(13) * 160) + "' height='70' fill='" + c1 + "' opacity='0.35'/>" +
      "<path d='M0 " + (120 + r(2) * 30) + " Q 80 " + (60 + r(4) * 40) + ", 160 110 T 320 90' stroke='" + c1 + "' stroke-width='4' fill='none' opacity='0.7'/>" +
      "</svg>";
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
  }

  /* ---- sample feed ---- */
  const STORIES = [
    { title: 'Nvidia clears $4.5 trillion as data-center demand outruns supply forecasts', description: 'The chipmaker’s latest guidance implies another record quarter, with cloud providers front-loading orders ahead of the next accelerator generation. Analysts lifted price targets across the board.', source: 'Bloomberg', initials: 'BL', timestamp: '18m ago', datetime: '2026-08-14T13:42:00Z', symbol: 'NVDA', symbolChange: 3.11, sentiment: 'positive', topic: 'Earnings' },
    { title: 'Fed minutes signal a divided committee heading into September', description: 'Several members favored holding rates steady while a vocal minority pushed for a cut, citing softening in the labor market. Futures now price a coin-flip.', source: 'Reuters', initials: 'RE', timestamp: '1h ago', datetime: '2026-08-14T12:55:00Z', symbol: 'SPY', symbolChange: -0.42, sentiment: 'neutral', topic: 'Macro' },
    { title: 'Apple’s services segment tops estimates as hardware cycle cools', description: 'Recurring revenue crossed a new high even as iPhone units slipped, underscoring the pivot analysts have watched for three years.', source: 'CNBC', initials: 'CN', timestamp: '2h ago', datetime: '2026-08-14T11:40:00Z', symbol: 'AAPL', symbolChange: 1.24, sentiment: 'positive', topic: 'Earnings' },
    { title: 'Tesla recalls 62,000 vehicles over software fault in driver-assist stack', description: 'The over-the-air fix ships this week; regulators opened a preliminary review of the underlying subsystem.', source: 'WSJ', initials: 'WS', timestamp: '3h ago', datetime: '2026-08-14T10:30:00Z', symbol: 'TSLA', symbolChange: -2.67, sentiment: 'negative', topic: 'Autos' },
    { title: 'Oil steadies near $71 as OPEC+ holds output through the quarter', description: 'Traders shrugged off inventory builds; the cartel reaffirmed its production ceiling in a brief statement.', source: 'MarketWatch', initials: 'MW', timestamp: '4h ago', datetime: '2026-08-14T09:15:00Z', symbol: 'USO', symbolChange: 0.18, sentiment: 'neutral', topic: 'Commodities' },
    { title: 'Microsoft folds new agent tooling into Copilot for enterprise tier', description: 'The update targets regulated industries with audit trails and per-seat governance controls.', source: 'The Verge', initials: 'TV', timestamp: '5h ago', datetime: '2026-08-14T08:05:00Z', symbol: 'MSFT', symbolChange: 0.94, sentiment: 'positive', topic: 'AI' },
  ];
  const storyProps = (s, seed) => ({ title: s.title, description: s.description, source: s.source, sourceInitials: s.initials, timestamp: s.timestamp, datetime: s.datetime, image: thumb((seed || '') + s.title), symbol: s.symbol, symbolChange: s.symbolChange, sentiment: s.sentiment, topic: s.topic, imageAlt: '' });

  /* ---- control widgets ---- */
  function segmented(value, options, onChange, disabled) {
    return el('div', { class: 'pg-seg', role: 'group' }, options.map(o => {
      const val = Array.isArray(o) ? o[0] : o, lbl = Array.isArray(o) ? o[1] : o;
      return el('button', { type: 'button', 'aria-pressed': String(val) === String(value), disabled: disabled || undefined, onclick: () => onChange(val), text: lbl });
    }));
  }
  function toggleRow(label, checked, onChange, disabled) {
    const input = el('input', { type: 'checkbox', onchange: (e) => onChange(e.target.checked) });
    input.checked = checked; if (disabled) input.disabled = true;
    return el('label', { class: 'pg-toggle' + (disabled ? ' dim' : '') }, [
      el('span', { text: label }),
      el('span', { class: 'pg-switch' }, [input, el('span', { class: 'track' }), el('span', { class: 'thumb' })]),
    ]);
  }
  const ctrlGroup = (label, kids) => el('div', { class: 'pg-ctrl-group' }, [el('p', { class: 'pg-ctrl-label', text: label })].concat(kids));

  /* ---- generated code snippet ---- */
  function codeSnippet(cfg) {
    const DEF = { density: 'comfortable', state: 'default', signalLevel: 'high' };
    const rows = [];
    const add = (name, val, isStr) => {
      if (typeof val === 'boolean') { if (val) rows.push([name, null]); return; }
      if (val == null) return;
      rows.push([name, isStr ? '"' + val + '"' : '{' + JSON.stringify(val) + '}']);
    };
    add('preset', cfg.preset, true);
    if (cfg.density !== DEF.density) add('density', cfg.density, true);
    if (cfg.state !== DEF.state) add('state', cfg.state, true);
    add('titleLines', cfg.titleLines, typeof cfg.titleLines !== 'number');
    add('showDescription', cfg.showDescription);
    if (cfg.showDescription) add('descriptionLines', cfg.descriptionLines, false);
    add('showImage', cfg.showImage);
    if (cfg.showImage) add('imagePosition', cfg.imagePosition, true);
    add('metaPosition', cfg.metaPosition, true);
    add('showSymbol', cfg.showSymbol);
    add('showTopic', cfg.showTopic);
    if (cfg.showTopic && cfg.topicPosition !== 'badge') add('topicPosition', cfg.topicPosition, true);
    add('showSentiment', cfg.showSentiment);
    if (cfg.showSentiment && cfg.sentimentPosition !== 'right') add('sentimentPosition', cfg.sentimentPosition, true);
    add('showAI', cfg.showAI);
    if (cfg.showAI && cfg.aiPosition !== 'right') add('aiPosition', cfg.aiPosition, true);
    add('showSignalSpine', cfg.showSignalSpine);
    if (cfg.showSignalSpine && cfg.signalLevel !== DEF.signalLevel) add('signalLevel', cfg.signalLevel, true);

    const pre = el('pre', { class: 'pg-code' });
    pre.appendChild(el('span', { class: 'k', text: '<QXNewsItem' }));
    pre.appendChild(document.createTextNode('\n'));
    rows.forEach(([n, v]) => {
      pre.appendChild(document.createTextNode('  '));
      pre.appendChild(el('span', { class: 'a', text: n }));
      if (v !== null) { pre.appendChild(el('span', { class: 'p', text: '=' })); pre.appendChild(el('span', { class: 'v', text: v })); }
      pre.appendChild(document.createTextNode('\n'));
    });
    pre.appendChild(document.createTextNode('  '));
    pre.appendChild(el('span', { class: 'a', text: 'title' }));
    pre.appendChild(el('span', { class: 'p', text: '=' }));
    pre.appendChild(el('span', { class: 'v', text: '"…"' }));
    pre.appendChild(el('span', { class: 'k', text: ' />' }));
    return pre;
  }

  /* ---- playground ---- */
  function playground() {
    let cfg = { preset: 'feed', density: 'comfortable', state: 'default', titleLines: 2, showDescription: true, descriptionLines: 2, showImage: true, imagePosition: 'leading', metaPosition: 'top', showSymbol: true, showSentiment: true, showAI: true, showTopic: true, topicPosition: 'badge', sentimentPosition: 'right', aiPosition: 'right', showSignalSpine: false, signalLevel: 'high' };

    const controlsEl = el('div', { class: 'pg-card pg-controls' });
    const previewEl = el('div', { class: 'pg-list-frame' });
    const codeHolder = el('div');
    const stage = el('div', { class: 'pg-stage' }, [
      el('div', { class: 'pg-stage-inner' }, [previewEl]),
      el('p', { class: 'pg-hint', html: 'Live rows reflect the controls. Click the pink AI icon to open its summary; tab into the second row to see the focus ring.' }),
    ]);

    function effBadges() {
      const off = cfg.preset === 'embed';
      return { showSymbol: cfg.showSymbol && !off, showSentiment: cfg.showSentiment && !off, showAI: cfg.showAI && !off, showTopic: cfg.showTopic && !off };
    }

    function renderPreview() {
      clear(previewEl);
      const b = effBadges();
      const base = { preset: cfg.preset, density: cfg.density, titleLines: cfg.titleLines, showDescription: cfg.showDescription, descriptionLines: cfg.descriptionLines, showImage: cfg.showImage, imagePosition: cfg.imagePosition, metaPosition: cfg.metaPosition, showSignalSpine: cfg.showSignalSpine, signalLevel: cfg.signalLevel, showSymbol: b.showSymbol, showSentiment: b.showSentiment, showAI: b.showAI, showTopic: b.showTopic, topicPosition: cfg.topicPosition, sentimentPosition: cfg.sentimentPosition, aiPosition: cfg.aiPosition };
      const list = el('div', { class: 'qx-news-list' });
      list.appendChild(NI.render(Object.assign({}, base, storyProps(STORIES[0]), { state: cfg.state, image: cfg.showImage ? thumb(STORIES[0].title) : undefined })));
      list.appendChild(NI.render(Object.assign({}, base, storyProps(STORIES[1]), { image: cfg.showImage ? thumb(STORIES[1].title) : undefined })));
      previewEl.appendChild(list);
      clear(codeHolder).appendChild(codeSnippet(Object.assign({}, cfg, b)));
    }

    function renderControls() {
      clear(controlsEl);
      const off = cfg.preset === 'embed';
      const set = (patch) => { cfg = Object.assign({}, cfg, patch); renderControls(); renderPreview(); };
      const setPreset = (preset) => { const p = PRESETS[preset]; set({ preset, titleLines: p.titleLines, showDescription: p.showDescription, descriptionLines: p.descriptionLines, showImage: p.showImage, imagePosition: p.imagePosition, metaPosition: p.metaPosition }); };

      controlsEl.appendChild(ctrlGroup('Preset', segmented(cfg.preset, [['feed','Feed'],['editorial','Editorial'],['compact','Compact'],['lead','Lead'],['embed','Embed']], setPreset)));
      controlsEl.appendChild(ctrlGroup('Density', segmented(cfg.density, [['comfortable','Comfortable'],['compact','Compact']], v => set({ density: v }))));
      controlsEl.appendChild(ctrlGroup('State', segmented(cfg.state, [['default','Default'],['hover','Hover'],['focus','Focus'],['read','Read'],['loading','Loading'],['locked','Locked']], v => set({ state: v }))));
      controlsEl.appendChild(ctrlGroup('Title lines', segmented(cfg.titleLines, [[1,'1'],[2,'2'],[3,'3'],['full','Full']], v => set({ titleLines: v }))));
      controlsEl.appendChild(ctrlGroup('Description', [
        toggleRow('Show description', cfg.showDescription, v => set({ showDescription: v })),
        el('div', { class: 'pg-subctrl' + (cfg.showDescription ? '' : ' off') }, [segmented(cfg.descriptionLines, [[1,'1 line'],[2,'2 lines'],[3,'3 lines']], v => set({ descriptionLines: v }), !cfg.showDescription)]),
      ]));
      controlsEl.appendChild(ctrlGroup('Media', [
        toggleRow('Show image', cfg.showImage, v => set({ showImage: v })),
        el('div', { class: 'pg-subctrl' + (cfg.showImage ? '' : ' off') }, [segmented(cfg.imagePosition, [['leading','Leading'],['trailing','Trailing'],['above','Above']], v => set({ imagePosition: v }), !cfg.showImage)]),
      ]));
      controlsEl.appendChild(ctrlGroup('Meta position', segmented(cfg.metaPosition, [['top','Top'],['bottom','Bottom'],['right','Right']], v => set({ metaPosition: v }))));
      const placement = (on, value, opts, key) => el('div', { class: 'pg-subctrl pg-place' + (on ? '' : ' off') }, [segmented(value, opts, v => set({ [key]: v }), !on)]);
      const badgeKids = [
        toggleRow('Symbol chip', cfg.showSymbol && !off, v => set({ showSymbol: v }), off),
        toggleRow('Topic chip', cfg.showTopic && !off, v => set({ showTopic: v }), off),
        placement(cfg.showTopic && !off, cfg.topicPosition, [['badge','In badge row'],['top','Own row on top']], 'topicPosition'),
        toggleRow('Sentiment chip', cfg.showSentiment && !off, v => set({ showSentiment: v }), off),
        placement(cfg.showSentiment && !off, cfg.sentimentPosition, [['right','Right'],['badge','Badge row']], 'sentimentPosition'),
        toggleRow('AI icon', cfg.showAI && !off, v => set({ showAI: v }), off),
        placement(cfg.showAI && !off, cfg.aiPosition, [['right','Right'],['badge','Badge row']], 'aiPosition'),
      ];
      if (off) badgeKids.push(el('p', { style: 'font-size:11px;color:var(--qx-text-muted);margin:6px 0 0', text: 'Embed preset hides the badge row.' }));
      controlsEl.appendChild(ctrlGroup('Badges & signals', badgeKids));
      controlsEl.appendChild(ctrlGroup('Signal spine', [
        toggleRow('Show signal spine', cfg.showSignalSpine, v => set({ showSignalSpine: v })),
        el('div', { class: 'pg-subctrl' + (cfg.showSignalSpine ? '' : ' off') }, [segmented(cfg.signalLevel, [['high','High'],['medium','Medium'],['low','Low']], v => set({ signalLevel: v }), !cfg.showSignalSpine)]),
      ]));
    }

    renderControls();
    renderPreview();
    return el('div', { class: 'pg-play' }, [controlsEl, el('div', {}, [stage, codeHolder])]);
  }

  /* ---- galleries ---- */
  function galleryCard(name, presetName, desc, listNode) {
    return el('div', { class: 'pg-card' }, [
      el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: name }), el('span', { class: 's', text: 'preset="' + presetName + '"' })]),
      el('div', { class: 'pg-card-pad' }, [el('p', { class: 'pg-gal-note', text: desc }), listNode]),
    ]);
  }
  function presetList(preset, count, seed) {
    const list = el('div', { class: 'qx-news-list pg-inner-list' });
    STORIES.slice(0, count).forEach((s, i) => list.appendChild(NI.render(Object.assign({ preset, showSymbol: true, showTopic: true, showSentiment: true, showAI: true }, storyProps(s, (seed || '') + i)))));
    return list;
  }
  function presetGallery() {
    return el('div', { class: 'pg-grid-2' }, [
      galleryCard('Feed', 'feed', 'Default. Meta on top, 2-line title + description, leading image, full badge row.', presetList('feed', 2, 'f')),
      galleryCard('Editorial', 'editorial', 'Meta at the bottom, 3-line description, trailing image. Reads as a curated story.', presetList('editorial', 2, 'e')),
      galleryCard('Compact', 'compact', '1-line title, no description, no image. Dense side rails and Most Read.', presetList('compact', 4, 'c')),
      galleryCard('Embed', 'embed', '1-line title, source + time only, no badge row. WMID widget contexts.', presetList('embed', 4, 'm')),
    ]);
  }
  function leadGallery() {
    const list = el('div', { class: 'qx-news-list pg-inner-list' });
    list.appendChild(NI.render(Object.assign({ preset: 'lead', showSymbol: true, showTopic: true, showSentiment: true, showSignalSpine: true, signalLevel: 'high' }, storyProps(STORIES[0], 'lead'))));
    STORIES.slice(1, 4).forEach((s, i) => list.appendChild(NI.render(Object.assign({ preset: 'feed', showSymbol: true, showTopic: true }, storyProps(s, 'lf' + i)))));
    return el('div', { class: 'pg-card' }, [
      el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: 'Lead' }), el('span', { class: 's', text: 'preset="lead" — image above, full row width. One per module, always first.' })]),
      el('div', { class: 'pg-card-pad' }, [list]),
    ]);
  }
  function statesGallery() {
    const states = [
      ['default', 'Default', 'Row at container background, divider only.'],
      ['hover', 'Hover', 'Row background shifts; headline takes link-hover colour.'],
      ['focus', 'Focus', '2px ring on the row bounds, 2px offset (WCAG 2.4.7).'],
      ['read', 'Read / visited', 'Headline drops to secondary; image at 70% opacity.'],
      ['locked', 'Locked', 'Headline legible; description + image frosted with a lock affordance.'],
      ['loading', 'Loading', 'Skeleton mirrors the configured anatomy — no layout shift.'],
    ];
    const s = STORIES[2];
    return el('div', { class: 'pg-grid-3' }, states.map(([state, name, desc]) =>
      el('div', { class: 'pg-card' }, [
        el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: name }), el('span', { class: 's', text: state })]),
        el('div', { class: 'pg-card-pad' }, [
          el('p', { class: 'pg-gal-note', style: 'min-height:34px', text: desc }),
          el('div', { class: 'pg-inner-list' }, [NI.render(Object.assign({ preset: 'feed', state, showSymbol: true, showTopic: true, showSentiment: true }, storyProps(s, 'st')))]),
        ]),
      ])
    ));
  }
  function moduleCard(icon, title, more, rows) {
    const head = el('div', { class: 'pg-module-head' }, [el('span', { class: 'icon', 'aria-hidden': 'true', text: icon }), el('span', { class: 't', text: title })]);
    if (more) head.appendChild(el('a', { class: 'more', href: '#', text: more }));
    return el('div', { class: 'pg-card' }, [head, el('div', { class: 'qx-news-list' }, rows)]);
  }
  function usageInContext() {
    const feed = moduleCard('▤', 'Market news', 'See all', STORIES.map((s, i) =>
      NI.render(Object.assign({ preset: 'feed', showSymbol: true, showTopic: true, showSentiment: true, showAI: true, showSignalSpine: i === 0, signalLevel: 'high' }, storyProps(s, 'ctx' + i)))));

    // Top Stories shows the topic as a kicker on its own row and meta on the right.
    const top = moduleCard('★', 'Top stories', null, STORIES.slice(0, 3).map((s, i) =>
      NI.render(Object.assign({ preset: 'editorial', showSymbol: true, showTopic: true, topicPosition: 'top', showSentiment: true, metaPosition: 'right' }, storyProps(s, 'top' + i)))));

    const most = moduleCard('≡', 'Most read', null, STORIES.slice(1, 6).map((s) =>
      NI.render({ preset: 'compact', title: s.title, source: s.source, sourceInitials: s.initials, timestamp: s.timestamp, datetime: s.datetime, symbol: s.symbol, symbolChange: s.symbolChange, showSymbol: true, showTopic: false })));

    const embedInner = el('div', { class: 'qx-news-list' }, STORIES.slice(2, 6).map((s) =>
      NI.render({ preset: 'embed', density: 'compact', title: s.title, source: s.source, sourceInitials: s.initials, timestamp: s.timestamp, datetime: s.datetime })));
    const embed = el('div', { class: 'pg-embed-frame' }, [
      el('p', { class: 'pg-embed-note', text: 'Third-party page · QX widget (Embed)' }),
      el('div', { class: 'pg-card', style: 'border-radius:6px' }, [
        el('div', { class: 'pg-module-head', style: 'padding:8px 12px' }, [el('span', { class: 't', style: 'font-size:13px', text: 'AAPL · News' })]),
        embedInner,
      ]),
    ]);

    return el('div', { class: 'pg-usage' }, [feed, el('div', { class: 'pg-rail' }, [top, most, embed])]);
  }

  function anatomy() {
    const rows = [
      ['Row', 'Required', 'Outer container and the single interactive target / tab stop (native <a>).'],
      ['Signal spine', 'Optional', '3px left border coloured by importance rank. Off by default.'],
      ['Media', 'Optional', 'Thumbnail or branded fallback tile, 16:9 crop-to-fill. Position: leading / trailing / above.'],
      ['Topic kicker', 'Optional', 'Topic chip on its own row above the headline (topicPosition="top").'],
      ['Meta row', 'Optional pos.', 'Source · relative timestamp. Renders top, bottom, or in the right aside — only one at a time.'],
      ['Title', 'Required', 'Headline. Line-clamped per titleLines. The accessible name.'],
      ['Description', 'Optional', 'Story snippet. Line-clamped per descriptionLines.'],
      ['Badge row', 'Optional', 'Symbol chip · topic (unless on top). Collapses with no reserved space.'],
      ['Right aside', 'Optional', 'Sentiment chip + AI icon (their default home) and, optionally, the meta row.'],
      ['Divider', 'Optional', '0.5px rule between rows — owned by the list container, not the row.'],
    ];
    const tbody = el('tbody', {}, rows.map(([n, req, note]) =>
      el('tr', {}, [el('td', { class: 'n', text: n }), el('td', { class: 'req' + (req === 'Required' ? ' yes' : ''), text: req }), el('td', { text: note })])));
    const table = el('table', { class: 'pg-anat' }, [
      el('thead', {}, [el('tr', {}, [el('th', { text: 'Part' }), el('th', { text: 'Required' }), el('th', { text: 'Notes' })])]),
      tbody,
    ]);
    const a11y = el('ul', { class: 'pg-a11y' });
    [
      'Row is a native <code>&lt;a&gt;</code> — one tab stop; <code>Enter</code> opens the story (or the upgrade modal when locked).',
      'Accessible name is the headline alone; source, time, symbol, topic and sentiment stay in DOM order after the title even when <code>metaPosition="top"</code> reorders them visually.',
      'Focus is a visible 2px ring at 2px offset — colour change is never the only signal (WCAG 2.4.7).',
      'Sentiment pairs a shape with the tone token and carries an <code>aria-label</code> ("Positive sentiment"), not colour alone (WCAG 1.4.1).',
      'The AI icon is an interactive control (<code>role="button"</code>, <code>aria-haspopup="dialog"</code>) labelled "Summary generated by AI" — click or Enter opens the summary popover, Esc closes it; the timestamp is wrapped in <code>&lt;time datetime&gt;</code>.',
      'Locked rows keep the headline legible and add <code>aria-describedby</code> explaining the upgrade — the headline is never blurred.',
    ].forEach(html => a11y.appendChild(el('li', { html })));
    return el('div', { class: 'pg-grid-2' }, [
      el('div', { class: 'pg-card' }, [el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: 'Anatomy' }), el('span', { class: 's', text: 'Feed configuration, top to bottom' })]), el('div', { class: 'pg-card-pad' }, [table])]),
      el('div', { class: 'pg-card' }, [el('div', { class: 'pg-card-head' }, [el('span', { class: 't', text: 'Accessibility' }), el('span', { class: 's', text: 'Built into the component' })]), el('div', { class: 'pg-card-pad' }, [a11y])]),
    ]);
  }

  function section(eyebrow, title, lede, body) {
    const kids = [el('p', { class: 'pg-eyebrow', text: eyebrow }), el('h2', { class: 'pg-h2', text: title })];
    if (lede) kids.push(el('p', { class: 'pg-lede', text: lede }));
    kids.push(body);
    return el('section', { class: 'pg-section' }, kids);
  }

  /* ---- mount ---- */
  const app = document.getElementById('app');
  app.appendChild(el('header', { class: 'pg-appbar' }, [
    el('span', { class: 'pg-wordmark', html: 'Qmodii<span class="dot">.</span>' }),
    el('span', { class: 'pg-title', text: 'QX-NewsItem' }),
    el('span', { class: 'pg-sub', text: 'News article row · prototype playground' }),
    el('span', { class: 'pg-spacer' }),
    el('span', { class: 'pg-tag', text: 'Draft' }),
  ]));
  const wrap = el('div', { class: 'pg-wrap' });
  wrap.appendChild(section('Playground', 'Configure the row', 'One row component for every news story across QSweb, Quotestream Mobile, Research Hub and QX/QMOD widgets. Presets are named prop bundles — pick one, then override any individual prop. Everything below is the live Qmodii component driven by design tokens.', playground()));
  const presets = el('div', {}, [presetGallery(), el('div', { style: 'height:20px' }), leadGallery()]);
  wrap.appendChild(section('Variants', 'Presets', 'Choosing a preset sets defaults; individual props stay overridable. One preset per list — a Lead row is the only permitted exception.', presets));
  wrap.appendChild(section('States', 'Interactive & render states', 'Hover, focus, read, locked and loading. The skeleton mirrors the configured anatomy exactly so nothing shifts when data lands.', statesGallery()));
  wrap.appendChild(section('In context', 'Real feed modules', 'The same component across a primary market-news feed (Feed + one Lead), a curated Top Stories rail (Editorial), a dense Most Read list (Compact), and a space-constrained third-party widget (Embed).', usageInContext()));
  wrap.appendChild(section('Reference', 'Anatomy & accessibility', null, anatomy()));
  app.appendChild(wrap);
})();
</script>
</body>
</html>
